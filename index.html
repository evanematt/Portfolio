<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- bump ?v= on all four files whenever the code or sprites change, so browsers fetch the new ones -->
  <link rel="stylesheet" href="styles.css?v=2026-10-22.7" />
</head>
<body>
  <div class="wallpaper" id="wallpaper"></div>

  <header class="menubar">
    <div class="menubar-left">
      <span class="menubar-logo">●</span>
      <strong id="siteName">Portfolio</strong>
      <button class="menubar-item" data-open="about">Info</button>
      <button class="menubar-item" data-open="arrange">Arrange</button>
    </div>
    <div class="menubar-right">
      <a class="menubar-item" id="igLink" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
      <a class="menubar-item" id="mailLink" aria-label="Email">Mail</a>
      <span class="menubar-clock" id="clock"></span>
    </div>
  </header>

  <main class="desktop" id="desktop" aria-label="Projects"></main>

  <nav class="dock" id="dock" aria-label="Dock">
    <button class="dock-item" data-open="about" title="About">
      <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#fdd84a"/><rect x="11" y="13" width="26" height="3" rx="1.5" fill="#fff"/><rect x="11" y="21" width="26" height="2" rx="1" fill="#c9a522"/><rect x="11" y="27" width="20" height="2" rx="1" fill="#c9a522"/><rect x="11" y="33" width="23" height="2" rx="1" fill="#c9a522"/></svg>
    </button>
    <button class="dock-item" data-open="all" title="All projects">
      <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#fff"/><g transform="translate(24 24)"><ellipse rx="5" ry="11" fill="#f9b52b" transform="rotate(0)" opacity=".9"/><ellipse rx="5" ry="11" fill="#f2603c" transform="rotate(45)" opacity=".8"/><ellipse rx="5" ry="11" fill="#9b5de5" transform="rotate(90)" opacity=".8"/><ellipse rx="5" ry="11" fill="#3fa7f5" transform="rotate(135)" opacity=".8"/></g></svg>
    </button>
    <span class="dock-sep"></span>
    <a class="dock-item" id="dockIg" target="_blank" rel="noopener" title="Instagram">
      <svg viewBox="0 0 48 48"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fcb045"/><stop offset=".5" stop-color="#fd1d1d"/><stop offset="1" stop-color="#833ab4"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#ig)"/><rect x="12" y="12" width="24" height="24" rx="7" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="5.5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="31" cy="17" r="1.8" fill="#fff"/></svg>
    </a>
    <a class="dock-item" id="dockMail" title="Mail">
      <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#1e90ff"/><rect x="10" y="14" width="28" height="20" rx="3" fill="#fff"/><path d="M11 16 24 26 37 16" fill="none" stroke="#1e90ff" stroke-width="2.4" stroke-linejoin="round"/></svg>
    </a>
    <span class="dock-sep"></span>
    <button class="dock-item" data-open="arrange" title="Tidy up desktop">
      <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="#e9ecef"/><path d="M15 17h18l-2 20H17z" fill="#fff" stroke="#9aa1a8" stroke-width="1.6"/><rect x="13" y="13" width="22" height="4" rx="1.5" fill="#b9bfc5"/><path d="M20 21v12M24 21v12M28 21v12" stroke="#b9bfc5" stroke-width="1.4"/></svg>
    </button>
  </nav>

  <div class="windows" id="windows"></div>

  <script src="projects.js?v=2026-10-22.7"></script>
  <script src="app.js?v=2026-10-22.7"></script>
  <script src="character.js?v=2026-10-22.7"></script>
</body>
</html>
